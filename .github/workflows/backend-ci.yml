name: Backend CI/CD Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      # ==========================================
      # 1. Checkout source code
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Java 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: "backend/pom.xml"

      # ==========================================
      # 3. Make Maven Wrapper executable
      # ==========================================
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # ==========================================
      # 4. Compile & Verify Code
      # Tránh lỗi thiếu Database datasource khi chạy contextLoads test
      # ==========================================
      - name: Compile and Verify Build
        run: ./mvnw clean test-compile

      # ==========================================
      # 5. Setup Docker Buildx
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # 6. Login Docker Hub
      # Chỉ login khi push/merge vào nhánh main (bỏ qua với Pull Request)
      # ==========================================
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # 7. Generate Docker Image metadata
      # ==========================================
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/houseboarding
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      # ==========================================
      # 8. Build and Push Docker Image
      # ==========================================
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # 9. Trigger Render Deployment
      # ==========================================
      - name: Trigger Render Deploy Hook
        if: github.event_name != 'pull_request'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render redeployment..."
            curl -f -s -X POST "$RENDER_DEPLOY_HOOK_URL" || curl -f -s -X GET "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK_URL is not configured in Secrets. Skipping deployment trigger."
          fi
